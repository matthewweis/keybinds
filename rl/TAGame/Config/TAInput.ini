[Configuration]
; don't necessarily want this, but defining Extends= makes this class a candidate root node for tests? inherited arrays getting cleared either way
Extends=PlayerController_TA
; RocketLeague Input Configuration Load order:
;   - C:\Program Files\Epic Games\rocketleague\Engine\Config\BaseInput.ini
;   - C:\Program Files\Epic Games\rocketleague\TAGame\Config\DefaultInput.ini
;   - %USERPROFILE%\Documents\My Games\RocketLeague\TAGame\Config\TAInput.ini
;   - if Cloud Storage Saves are enabled, a copy of the last TAInput.ini is also stored remotely.
;
; These files are loaded every time the game starts, but may have to applied by selecting the "Custom" binding profile and clicking "Default" (because this file IS the de-facto default). The backup is used when a local TAInput.ini cannot be located or read.
;
; To split the configuration across multiple files, add a Configuration section to this file and set BasedOn= to the desired path. For example:
; > [Configuration]
; > BasedOn=..\..\..\..\Users\mw\Documents\My Games\Rocket League\TAGame\Config\TAInputOriginal.ini
;
; Keep this file write-locked to prevent the game and launcher from overwriting it. Disable cloud storage. Keep backups.
;
; https://docs.unrealengine.com/udk/Three/KeyBinds.html#Keyboard

[Engine.PlayerInput]
bIsUsingMouseAirRotation=False
bIsUsingMouseMovement=False
bIsUsingMouseAirPitch=False
bIsUsingMouseAirRoll=False
bIsUsingMouseAirYaw=False
bIsUsingMouseSteer=False
bIsUsingMouseAir=False
; scales mouse based on fov
bEnableFOVScaling=False ; todo check default
MoveForwardSpeed=1200
MoveStrafeSpeed=1200
LookRightScale=300
; todo change back to -250
LookUpScale=-666
; float - value by which all mouse movements are multiplied (recommended: 60.0f)
MouseSensitivity=60.0
; float - maximum number of seconds between two mouse clicks for the game menu to register them as a double-click (recommended: 0.2)
DoubleClickTime=0.2f
; boolean - scales mouse movements by deltatime on the menu (and when used as a virtual axis?) (recommended: true)
bEnableMouseSmoothing=False
bEnableFOVScaling=False
bCapturingMouseInput=False

[Engine.PlayerInput_TA]
GamepadDeadzone=0.0

[GameFramework.DebugCameraController]
PrimaryKey=LeftMouseButton
SecondaryKey=RightMouseButton
UnselectKey=Escape
bShowSelectedInfo=true

